name: Update guide

on:
  schedule:
    - cron: "0 3 * * *"   # כל לילה, 03:00 UTC (בישראל 05:00 או 06:00)
  workflow_dispatch:        # הרצה ידנית מלשונית Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Archive past days from the previous guide (past/, one week back)
        continue-on-error: true
        run: node archive_past.mjs
      - name: Fetch guide from Walla
        run: node scrape.mjs --all --range 3690 3850
      - name: Add Reshet 13 summaries
        continue-on-error: true
        run: node enrich13.mjs
      - name: Add Sport 1-6 match details
        continue-on-error: true
        run: node enrich_sport1.mjs
      - name: Add Sport 5 match details
        continue-on-error: true
        run: node enrich_sport5.mjs
      - name: Add Kan 11 summaries
        continue-on-error: true
        run: node enrich_kan.mjs
      - name: Add ONE match details
        continue-on-error: true
        run: node enrich_one.mjs
      - name: Add Keshet 12 summaries
        continue-on-error: true
        run: node enrich_keshet.mjs
      - name: Fetch HOT via the Tel Aviv relay (HOT and channel 14 block servers outside Israel)
        continue-on-error: true
        timeout-minutes: 3
        env:
          HOT_RELAY_URL: ${{ secrets.HOT_RELAY_URL }}
          HOT_RELAY_KEY: ${{ secrets.HOT_RELAY_KEY }}
        run: node tools/il-relay/fetch.mjs
      - name: Add channels missing from Walla (Channel 14, i24NEWS, Kan Educational)
        continue-on-error: true
        run: node extra_channels.mjs
      - name: Add HOT summaries from cache (filled by the home computer)
        continue-on-error: true
        run: node enrich_hot.mjs --apply-cache
      - name: Add HOT summaries from the relay data (also refreshes hot-cache.json)
        continue-on-error: true
        run: if [ -f hot-raw.json ]; then node enrich_hot.mjs --from hot-raw.json; else echo "no relay data"; fi
      - name: Fill missing summaries from summary memory (same channel, same title, same summary on 2+ days)
        continue-on-error: true
        run: node desc_memory.mjs
      - name: Fetch Netflix list from TMDB (+ ratings from OMDb, top 10 from Netflix, Hebrew titles from Wikidata)
        continue-on-error: true
        timeout-minutes: 12
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: |
          if [ -n "$TMDB_API_KEY" ]; then node netflix.mjs; else echo "TMDB_API_KEY not set, skipping"; fi
      - name: Commit if changed
        run: |
          git config user.name "guide-bot"
          git config user.email "guide-bot@users.noreply.github.com"
          git add guide.json
          if [ -d past ]; then git add -A past; fi
          if [ -f extra-cache.json ]; then git add extra-cache.json; fi
          if [ -f hot-cache.json ]; then git add hot-cache.json; fi
          if [ -f desc-memory.json ]; then git add desc-memory.json; fi
          if [ -f netflix.json ]; then git add netflix.json; fi
          if [ -f disney.json ]; then git add disney.json; fi
          if [ -f netflix-seen.json ]; then git add netflix-seen.json; fi
          if [ -f disney-seen.json ]; then git add disney-seen.json; fi
          if [ -f ratings-cache.json ]; then git add ratings-cache.json; fi
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update guide"
            git pull --rebase -X theirs origin main || true
            git push
          fi
