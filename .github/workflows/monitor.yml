name: Monitor

# בדיקת בריאות כל שעתיים (🔴 רק על תקלה חדשה) + בבוקר 08:00 שעון ישראל סיכום עם בדיקת UX מלאה:
# יומי, ביום ראשון שבועי, ב-1 לחודש חודשי (במקום היומי).
# 05:00 UTC = 08:00 בקיץ; 06:00 UTC (בתוך ה-*/2) = 08:00 בחורף. notify.mjs --print-mode בוחר סיכום רק בחלון 08-12 בישראל ופעם ביום.
# ההיסטוריה (35 יום) נשמרת ב-actions/cache: כל ריצה שומרת מפתח חדש ו-restore-keys מחזיר את האחרון, כך שהרשומה נשארת "בשימוש" וה-7 ימים של תפוגה לא חלים.
# אם ה-cache נמחק (ידנית/תקלה) ההיסטוריה מתחילה מחדש, והסיכומים השבועי/חודשי יציגו פחות נתונים עד שתצטבר.
on:
  schedule:
    - cron: "0 */2 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      force_summary:
        description: "שלח סיכום בוקר מלא (כולל בדיקת UX) עכשיו"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # ביקורת הפריסה (גלילה בכל מסך) מאריכה את ריצת ה-UX
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # מצב אחרון (ok/bad) – ב-cache ולא ב-commit. המפתח משתנה בכל הרצה; restore-keys מביא את האחרון.
      - name: Restore monitor state
        uses: actions/cache@v4
        with:
          path: monitor-state.json
          key: monitor-state-${{ github.run_id }}
          restore-keys: monitor-state-
      - name: Pick mode
        id: mode
        run: |
          if [ "${{ inputs.force_summary }}" = "true" ]; then F="--force"; else F=""; fi
          echo "mode=$(node tools/monitor/notify.mjs --print-mode --state monitor-state.json $F)" >> "$GITHUB_OUTPUT"
      - name: Health check
        run: node tools/monitor/health.mjs --out health.json > /dev/null
      - name: UX run (summary only; כולל ביקורת פריסה - tools/qa/audit.cjs)
        if: steps.mode.outputs.mode != 'check'
        continue-on-error: true
        env:
          TVG_NO_WRITES: "1"   # לא כותבים לשרת התזכורות מהבדיקה
        run: |
          (cd tools/qa && npm ci --no-audit --no-fund)
          export TVG_NOW="$(date -Iseconds)"
          node tools/qa/shoot.cjs shots "https://eladweiss-ops.github.io/tv-guide/" 2>&1 | tee ux.txt || true
      - name: Notify
        run: |
          UX=""; [ -f ux.txt ] && UX="--ux ux.txt --shots shots"
          node tools/monitor/notify.mjs --health health.json --state monitor-state.json --mode "${{ steps.mode.outputs.mode }}" $UX
