<!doctype html>
<html lang="he" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>לוח שידורים אישי</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="לוח שידורים">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
<style>
  /* Layout: one column built for a thumb. Sticky header (title, channel chooser, two tabs, search). "Now" = one card per channel. "Grid" = channel dropdown, five day buttons, one list. Nothing scrolls sideways. */
  :root {
    --bg: #f7f5fb;
    --surface: #ffffff;
    --ink: #16142b;
    --muted: #54506b;
    --line: #ddd9ea;
    --accent: #1b2a8f;
    --accent-ink: #ffffff;
    --soft: #ebe7f6;
    --live: #c8381f;
    --c-ent: #ff6a2b; --c-news: #1b2a8f; --c-life: #6fcbb8; --c-oth: #c9c7d1;
    --font-body: "Heebo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    --font-display: "Secular One", "Heebo", system-ui, Arial, sans-serif;
  }
  :root[data-theme="dark"] {
    --bg: #15131f; --surface: #201d2e; --ink: #f1effa; --muted: #b3aecb; --line: #38334d;
    --accent: #9aa6ff; --accent-ink: #10102a; --soft: #2a2640; --live: #ff8466;
    --c-ent: #ff7f45; --c-news: #8a96ff; --c-life: #5cbfa9; --c-oth: #6b6780;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { font-size: 112.5%; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font-body); font-size: 1rem; line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
  }
  [hidden] { display: none !important; }
  .page { max-width: 680px; margin: 0 auto; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  header.top {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 12px 0 10px; display: flex; flex-direction: column; gap: 10px;
    border-bottom: 1px solid var(--line);
  }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; margin: 0; }
  .ghost {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 14px; font-weight: 500; min-height: 44px;
  }
  .tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--soft); border-radius: 12px; padding: 4px; gap: 4px; }
  .tabs button { border: 0; background: transparent; padding: 10px; border-radius: 9px; font-weight: 700; color: var(--muted); min-height: 46px; }
  .tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  input[type="search"] {
    width: 100%; border: 1px solid var(--line); background: var(--surface);
    border-radius: 12px; padding: 11px 14px; min-height: 48px;
  }

  main { display: flex; flex-direction: column; gap: 14px; padding-top: 16px; }
  .note { background: var(--soft); border-radius: 12px; padding: 12px 14px; color: var(--ink); }
  .note b { font-weight: 700; }
  .note code { font-family: ui-monospace, Consolas, monospace; direction: ltr; unicode-bidi: embed; background: var(--surface); padding: 1px 6px; border-radius: 6px; }
  .none { color: var(--muted); margin: 0; }
  .btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 700; min-height: 48px; }

  /* now */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; min-width: 0; }
  .chn { font-size: 0.95rem; font-weight: 700; color: var(--accent); }
  .cur { font-size: 1.45rem; line-height: 1.25; margin: 0; font-weight: 700; text-wrap: balance; overflow-wrap: anywhere; }
  .meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 1rem; font-variant-numeric: tabular-nums; }
  .prog { height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; }
  .prog i { display: block; height: 100%; background: var(--live); }
  .next { margin: 2px 0 0; color: var(--muted); overflow-wrap: anywhere; }
  .next b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 700; margin-inline-end: 8px; }
  .more { display: none; border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 4px; }
  .more p { margin: 0; }
  .rem { margin-top: 10px; min-height: 44px; padding: 8px 14px; font-size: .9rem; }
  .rem[disabled] { opacity: .75; }
  .dcard { position: relative; }
  /* בלשונית "היום" יש מעל השעון גם בחירת ערוץ וימים, אז הכותרת לא צמודה: אחרת היא חותכת את השעון כשגוללים אל הכרטיס. */
  body.tab-dial header.top { position: static; }
  .rem.sm { position: absolute; top: 10px; left: 10px; margin: 0; width: 44px; height: 44px; min-height: 0; padding: 0; border-radius: 50%; font-size: 1.15rem; line-height: 1; display: flex; align-items: center; justify-content: center; }
  .open > .more { display: block; }

  /* grid */
  .sel { display: flex; flex-direction: column; gap: 4px; }
  .lbl { font-size: 0.9rem; font-weight: 700; color: var(--muted); }
  select {
    width: 100%; min-height: 50px; border: 1px solid var(--line); background: var(--surface);
    border-radius: 12px; padding: 10px 14px; font-weight: 500;
  }
  .days { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .day {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
    border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 6px 2px; min-height: 56px; line-height: 1.25;
  }
  .day span { font-size: 0.85rem; color: var(--muted); }
  .day b { font-size: 0.92rem; font-variant-numeric: tabular-nums; }
  .day[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
  .day[aria-pressed="true"] span, .day[aria-pressed="true"] b { color: var(--accent-ink); }
  .list { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 3.6rem minmax(0, 1fr); gap: 12px; padding: 14px 16px; border-top: 1px solid var(--line); cursor: pointer; }
  .row:first-child { border-top: 0; }
  .time { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 500; }
  .ttl { font-weight: 500; font-size: 1.0625rem; overflow-wrap: anywhere; min-width: 0; }
  .row .more { grid-column: 2; margin: 4px 0 0; }
  .row.now { background: var(--soft); }
  .row.now .time { color: var(--live); font-weight: 700; }
  .row.past .ttl, .row.past .time { opacity: .6; }
  .tag { display: inline-block; margin-inline-start: 8px; font-size: 0.8rem; color: var(--live); font-weight: 700; }
  .sub { color: var(--muted); font-size: 0.9rem; font-weight: 400; }

  /* sheet */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 20; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface);
    border-radius: 18px 18px 0 0; max-height: 88vh; overflow-y: auto; overscroll-behavior: contain;
    padding-top: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  }
  .sheet-in { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .sheet h2 { margin: 0; font-size: 1.2rem; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; }
  .opts { border-top: 1px solid var(--line); }
  .opt { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); min-height: 52px; }
  .opt input { width: 24px; height: 24px; accent-color: var(--accent); flex: none; }
  /* netflix */
  .nf { display: grid; grid-template-columns: 5rem minmax(0, 1fr); gap: 14px; padding: 14px 16px; border-top: 1px solid var(--line); cursor: pointer; }
  .nf:first-child { border-top: 0; }
  .poster { width: 100%; aspect-ratio: 2 / 3; border-radius: 8px; background: var(--soft); overflow: hidden; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 0.8rem; text-align: center; }
  .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .nfb { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .nfb .ttl { font-size: 1.1rem; font-weight: 700; }
  .ov { margin: 0; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .nf.open .ov { display: block; -webkit-line-clamp: unset; color: var(--ink); }
  .credit { font-size: 0.8rem; color: var(--muted); margin: 6px 0 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 12px; min-height: 38px; font-size: 0.92rem; font-weight: 500; }
  .sheet .chips { gap: 6px; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .gh { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0 6px; font-weight: 700; color: var(--accent); }
  .gh .ghost { min-height: 38px; padding: 4px 12px; font-size: 0.9rem; font-weight: 500; color: var(--ink); }
  .opt .sub { margin-inline-start: auto; }
  #done { position: sticky; bottom: 0; box-shadow: 0 -10px 12px -6px var(--surface); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; min-height: 48px; font-weight: 500; }
  .seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }

  /* dial */
  .dialwrap { display: flex; justify-content: center; }
  #dial { width: 100%; max-width: min(360px, 36vh); height: auto; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; border-radius: 50%; }
  #dial .k-ent { fill: var(--c-ent); } #dial .k-news { fill: var(--c-news); } #dial .k-life { fill: var(--c-life); } #dial .k-oth { fill: var(--c-oth); }
  #dial path.on { stroke: var(--ink); stroke-width: 4; stroke-linejoin: round; }
  #dial text { direction: rtl; unicode-bidi: plaintext; fill: var(--ink); font-family: var(--font-body); text-anchor: middle; }
  #dTitle { text-align: center; font: 500 16px/30px var(--font-body); color: var(--ink); white-space: nowrap; overflow: hidden; unicode-bidi: plaintext; pointer-events: none; }
  #dial .face { fill: var(--surface); }
  #dial .hand { stroke: var(--ink); stroke-width: 4; stroke-linecap: round; }
  #dial .knob { fill: var(--ink); }
  #dial .nowdot { fill: var(--live); stroke: var(--surface); stroke-width: 2; }
  .hint { text-align: center; color: var(--muted); font-size: 0.9rem; margin: -6px 0 0; }
  .dcard { cursor: default; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.9rem; color: var(--muted); }
  .legend i { display: inline-block; width: 14px; height: 14px; border-radius: 7px; margin-inline-end: 6px; vertical-align: -2px; }

  html, body { overflow-x: clip; overscroll-behavior-x: none; }
  #main, [data-cid] { touch-action: pan-y; }
  .pill { position: fixed; top: 38%; left: 50%; transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--bg); padding: 12px 22px; border-radius: 999px; font-weight: 700; font-size: 1.05rem; box-shadow: 0 6px 24px rgba(0,0,0,.28); pointer-events: none; white-space: nowrap; }
  @keyframes fromR { from { opacity: 0; transform: translateX(44px); } to { opacity: 1; transform: none; } }
  @keyframes fromL { from { opacity: 0; transform: translateX(-44px); } to { opacity: 1; transform: none; } }
  .sech { margin: 8px 0 0; font-size: 1.05rem; font-weight: 700; }
  .srow { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 6px 4px 6px; }
  .srow .go { flex: 1; min-width: 0; display: grid; grid-template-columns: 3.4rem minmax(0, 1fr); gap: 10px; align-items: center; text-align: start; background: transparent; border: 0; padding: 8px 8px; min-height: 56px; }
  .srow .time { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--live); }
  .srow .ttl { font-weight: 700; overflow-wrap: anywhere; }
  .rbt { flex: none; width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); background: var(--soft); font-size: 1.15rem; }
  .fav { margin-top: 10px; min-height: 44px; }
  .nav { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 2px; }
  .nav.two { grid-template-columns: auto 1fr; }
  .step { display: block; width: 100%; min-height: 48px; text-align: start; overflow-wrap: anywhere; }
  .step b { font-variant-numeric: tabular-nums; margin-inline-end: 8px; }
  .badge { display: inline-block; margin-inline-start: 8px; padding: 1px 10px; border-radius: 999px; background: var(--soft); color: var(--ink); font-size: .8rem; font-weight: 700; }
  .card .rem { align-self: flex-start; }
  #dial .fs { fill: #fff; stroke: var(--ink); stroke-width: 3; paint-order: stroke; font-size: 15px; pointer-events: none; }
  @media (prefers-reduced-motion: no-preference) { .from-r { animation: fromR .26s ease-out; } .from-l { animation: fromL .26s ease-out; } }
  @media (prefers-reduced-motion: no-preference) { .prog i { transition: width .4s; } }

  /* ===== iOS 27 / Liquid Glass ===== */
  :root {
    --bg: #f2f2f7; --surface: #ffffff; --ink: #1c1c1e; --muted: #6c6c70; --line: #e5e5ea;
    --accent: #0a5fd6; --accent-ink: #ffffff; --soft: rgba(118,118,128,.12); --live: #c0392b;
    --c-ent: #ff9500; --c-news: #5856d6; --c-life: #30b0c7; --c-oth: #c7c7cc;
    --glass: rgba(255,255,255,.62); --glass-line: rgba(255,255,255,.8); --glass-edge: rgba(0,0,0,.14);
    --sel: rgba(118,118,128,.16); --sheet: rgba(250,250,252,.86); --barbg: rgba(242,242,247,.82);
    --font-body: -apple-system, "SF Pro Text", "SF Hebrew", "Heebo", system-ui, "Segoe UI", Arial, sans-serif;
    --font-display: -apple-system, "SF Pro Display", "Heebo", system-ui, Arial, sans-serif;
  }
  :root[data-theme="dark"] {
    --bg: #000000; --surface: #1c1c1e; --ink: #ffffff; --muted: #a1a1a6; --line: #38383a;
    --accent: #4da3ff; --accent-ink: #00142e; --soft: rgba(118,118,128,.24); --live: #ff6b5e;
    --c-ent: #ff9f0a; --c-news: #7d7aff; --c-life: #40c8e0; --c-oth: #636366;
    --glass: rgba(72,72,78,.55); --glass-line: rgba(255,255,255,.2); --glass-edge: rgba(255,255,255,.1);
    --sel: rgba(0,0,0,.34); --sheet: rgba(52,52,58,.84); --barbg: rgba(0,0,0,.72);
  }
  body { padding-top: calc(env(safe-area-inset-top, 0px) + 4px); padding-bottom: calc(118px + env(safe-area-inset-bottom, 0px)); letter-spacing: -0.1px; }
  h1 { font-family: var(--font-display); font-weight: 800; font-size: 2.1rem; letter-spacing: -0.4px; line-height: 1.1; }
  .glass { background: var(--glass); border: 1px solid var(--glass-line); box-shadow: 0 0 0 .5px var(--glass-edge), 0 6px 20px rgba(0,0,0,.07); -webkit-backdrop-filter: blur(24px) saturate(190%); backdrop-filter: blur(24px) saturate(190%); }
  .round { position: relative; width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; padding: 0; color: var(--ink); flex: none; }
  .round.big { width: 64px; height: 64px; }
  .cnt { position: absolute; top: -4px; left: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-size: .72rem; font-weight: 700; line-height: 20px; text-align: center; }
  .cnt:empty { display: none; }

  header.top { background: var(--barbg); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border-bottom: 1px solid transparent; padding: 10px 0 10px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; transition: border-color .2s; }
  body.scrolled header.top { border-bottom-color: var(--line); }
  body.tab-dial header.top { background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; }
  #qwrap input { border: 0; background: var(--soft); border-radius: 24px; min-height: 48px; padding: 10px 18px; }

  .dock { position: fixed; z-index: 10; left: 0; right: 0; margin: 0 auto; width: min(calc(100% - 32px), 648px); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; align-items: stretch; }
  .dock .tabs { flex: 1; min-width: 0; height: 64px; border-radius: 32px; padding: 4px; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; background: var(--glass); }
  .dock .tabs button { border: 0; background: transparent; border-radius: 28px; padding: 0; min-height: 0; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .62rem; font-weight: 600; }
  .dock .tabs button[aria-selected="true"] { background: var(--sel); color: var(--accent); font-weight: 700; box-shadow: none; }

  .card { border: 0; border-radius: 26px; padding: 18px; }
  .list { border: 0; border-radius: 24px; }
  .srow { border: 0; border-radius: 22px; }
  .row.now { background: var(--soft); }
  .chn { color: var(--c-news); }
  .btn { border-radius: 999px; min-height: 50px; padding: 12px 22px; box-shadow: inset 0 1px 0 rgba(255,255,255,.3); }
  .ghost { border: 0; background: var(--soft); border-radius: 999px; padding: 8px 18px; }
  .step { border-radius: 16px; }
  .chip { border: 0; background: var(--soft); min-height: 40px; padding: 4px 16px; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  select { border: 0; border-radius: 24px; min-height: 50px; padding: 10px 18px; background: var(--surface); }
  .days { background: var(--soft); border-radius: 26px; padding: 3px; gap: 0; }
  .day { border: 0; background: transparent; border-radius: 23px; min-height: 52px; }
  .day span, .day b { color: var(--muted); }
  .day[aria-pressed="true"] { background: var(--surface); box-shadow: 0 0 0 .5px rgba(0,0,0,.08), 0 2px 8px rgba(0,0,0,.12); border: 0; }
  .day[aria-pressed="true"] span, .day[aria-pressed="true"] b { color: var(--ink); font-weight: 700; }
  .seg button { border: 0; background: var(--soft); border-radius: 999px; }
  .seg { grid-template-columns: repeat(3, 1fr); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .rbt { border: 0; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
  .prog { background: var(--soft); }
  .prog i { background: var(--c-ent); }
  .legend i { border-radius: 50%; }
  #dial .knob { fill: var(--surface); stroke: var(--ink); stroke-width: 4; }
  #dial path.on { stroke-width: 3; }

  .scrim { background: rgba(0,0,0,.28); }
  .sheet { left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); border-radius: 40px; max-height: 86vh; padding: 22px 22px 22px; background: var(--sheet); border: 1px solid var(--glass-line); box-shadow: 0 0 0 .5px var(--glass-edge), 0 20px 50px rgba(0,0,0,.22); -webkit-backdrop-filter: blur(32px) saturate(190%); backdrop-filter: blur(32px) saturate(190%); }
  .sheet h2 { font-size: 1.35rem; font-weight: 800; }
  #done { box-shadow: none; }
  .opts, .opt { border-color: var(--line); }

  @media (prefers-reduced-transparency: reduce) {
    :root { --glass: var(--surface); --sheet: var(--surface); --barbg: var(--bg); }
    .glass, header.top, .sheet { -webkit-backdrop-filter: none; backdrop-filter: none; }
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    :root { --glass: var(--surface); --sheet: var(--surface); --barbg: var(--bg); }
  }

  .hb { display: flex; gap: 10px; }
  .rbt.star { font-size: 1.3rem; color: var(--muted); }
  .rbt.star[aria-pressed="true"] { color: #ff9f0a; background: rgba(255,159,10,.16); }
  .go.sg { grid-template-columns: 1fr; }
  .xchip { display: inline-flex; align-items: center; gap: 8px; }
  #qwrap { position: relative; }
  #qwrap input { padding-inline-end: 52px; }
  #qwrap input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }

  $("#qx").addEventListener("click", function () { $("#q").value = ""; q = ""; qExact = null; $("#qx").hidden = true; render(); $("#q").focus(); });
  $("#chFind").addEventListener("input", function (e) { find = e.target.value; buildSheet(); });

  // רענון "עכשיו" כל דקה, וגם כשחוזרים לדף
  function refresh() { if (!G || document.hidden || q.trim() || !$("#sheet").hidden || !$("#rem").hidden) return; if (tab === "now") render(); else if (tab === "dial" && scrub == null && !dragging) updateDial(dialT()); }
  setInterval(refresh, 60000);
  document.addEventListener("visibilitychange", refresh);

  setTheme(store("tvg.theme") || "light");
  setInst();
  load().then(function (r) {
    G = r.g; isSample = r.s; classify(); index();
    try { var saved = JSON.parse(store("tvg.sel") || "null"); if (Array.isArray(saved)) saved.forEach(function (id) { id = IDMAP[id] || id; if (by.has(id)) sel.add(id); }); if (sel.size !== saved.length) saveSel(); } catch (e) {}
    var st0 = store("tvg.tab"); tab = (st0 === "grid" || st0 === "now") ? st0 : "dial";
    scrollNext = tab === "grid";
    render();
    if (needsPick() && store("tvg.tab") !== "nf") openSheet(true);
    // לשונית נטפליקס מופיעה רק אם הקובץ netflix.json קיים
    fetch("netflix.json", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (j) {
        if (!j || !(j.popular || []).length && !(j["new"] || []).length) return;
        NF = j;
        if (store("tvg.tab") === "nf") { tab = "nf"; if (!$("#sheet").hidden) openSheet(false); }
        render();
      }).catch(function () {});
  });
})();
</script>
