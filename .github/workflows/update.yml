name: Update guide

on:
  schedule:
    - cron: "0 3 * * *"   # כל לילה, 03:00 UTC (בישראל 05:00 או 06:00)
  workflow_dispatch:        # הרצה ידנית מלשונית Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch guide from Walla
        run: node scrape.mjs --all --range 3690 3850
      - name: Add Reshet 13 summaries
        continue-on-error: true
        run: node enrich13.mjs
      - name: Add Sport 1-6 match details
        continue-on-error: true
        run: node enrich_sport1.mjs
      - name: Add Sport 5 match details
        continue-on-error: true
        run: node enrich_sport5.mjs
      - name: Fetch Netflix list from TMDB
        continue-on-error: true
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -n "$TMDB_API_KEY" ]; then node netflix.mjs; else echo "TMDB_API_KEY not set, skipping"; fi
      - name: Commit if changed
        run: |
          git config user.name "guide-bot"
          git config user.email "guide-bot@users.noreply.github.com"
          git add guide.json
          if [ -f netflix.json ]; then git add netflix.json; fi
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update guide"
            git push
          fi
